name: Flutter Lab

on:
  push:
    branches: [main, app]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Validate OpenCode routing and permissions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('opencode.jsonc').read_text(encoding='utf-8'))
          assert c['model'] == 'openai/gpt-6-luna'
          assert c['default_agent'] == 'build'
          expected = {
              'build': 'openai/gpt-6-luna#medium',
              'plan': 'openai/gpt-6.2-sol#medium',
              'architect': 'openai/gpt-6.2-sol#medium',
              'reviewer': 'openai/gpt-6-luna#medium',
              'general': 'openai/gpt-6-luna#medium',
              'explore': 'openai/gpt-6-luna#low',
              'compaction': 'openai/gpt-6-luna#low',
              'title': 'openai/gpt-6-luna#low',
              'summary': 'openai/gpt-6-luna#low',
          }
          for agent, model in expected.items():
              assert c['agents'][agent]['model'] == model, agent
          for model, effort in [('gpt-6.2-sol','medium'), ('gpt-6-luna','medium')]:
              assert c['providers']['openai']['models'][model]['settings']['reasoningEffort'] == effort
          rules = {(r['action'],r['resource'],r['effect']) for r in c['permissions']}
          assert {('external_directory','*','ask'), ('shell','git push *','ask'), ('shell','gh pr merge *','deny'), ('shell','git push --force*','deny')} <= rules
          for agent in ('architect','reviewer'):
              a = c['agents'][agent]
              rules = {(r['action'],r['resource'],r['effect']) for r in a['permissions']}
              assert a['mode'] == 'subagent'
              assert {('edit','*','deny'), ('shell','*','deny')} <= rules
          assert set(c['mcp']['servers']) == {'dart','maestro','playwright','chrome-devtools'}
          assert c['plugins'] == []
          assert c['mcp']['servers']['chrome-devtools']['disabled'] is True
          blocked_skills = {'brainstorming', 'writing-plans', 'executing-plans',
                            'subagent-driven-development', 'using-git-worktrees',
                            'finishing-a-development-branch'}
          permissions = {(x['action'],x['resource'],x['effect']) for x in c['permissions']}
          assert {('skill', name, 'deny') for name in blocked_skills} <= permissions
          print('PASS lab OpenCode config and safeguards')
          PY
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Web on PR
        if: github.event_name == 'pull_request'
        run: flutter build web
