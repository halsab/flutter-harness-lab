name: Flutter Lab

on:
  push:
    branches: [main, app]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Validate OpenCode routing and permissions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('opencode.jsonc').read_text(encoding='utf-8'))
          assert c['model'] == 'openai/gpt-6-luna'
          assert c['default_agent'] == 'build'
          expected = {
              'build': 'openai/gpt-6-luna#high',
              'plan': 'openai/gpt-6.2-sol#medium',
              'architect': 'openai/gpt-6.2-sol#medium',
              'reviewer': 'openai/gpt-6.2-sol#medium',
              'general': 'openai/gpt-6-luna#medium',
              'explore': 'openai/gpt-6-luna#low',
              'compaction': 'openai/gpt-6-luna#low',
              'title': 'openai/gpt-6-luna#low',
              'summary': 'openai/gpt-6-luna#low',
          }
          for agent, model in expected.items():
              assert c['agents'][agent]['model'] == model, agent
          for model, effort in [('gpt-6.2-sol','medium'), ('gpt-6-luna','high')]:
              assert c['providers']['openai']['models'][model]['settings']['reasoningEffort'] == effort
          rules = {(r['action'],r['resource'],r['effect']) for r in c['permissions']}
          assert {('external_directory','*','ask'), ('shell','git push *','ask'), ('shell','gh pr merge *','deny'), ('shell','git push --force*','deny')} <= rules
          for agent in ('architect','reviewer'):
              a = c['agents'][agent]
              rules = {(r['action'],r['resource'],r['effect']) for r in a['permissions']}
              assert a['mode'] == 'subagent'
              assert {('edit','*','deny'), ('shell','*','deny')} <= rules
          assert set(c['mcp']['servers']) == {'dart','maestro','playwright','chrome-devtools'}
          assert c['plugins'] == ['superpowers@git+https://github.com/obra/superpowers.git#v7.0.2']
          print('PASS lab OpenCode config and safeguards')
          PY
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Web on PR
        if: github.event_name == 'pull_request'
        run: flutter build web
      - name: Set up Node.js for Web E2E
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Playwright Web E2E on built app
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8080 --directory build/web > /tmp/flutter-web-e2e.log 2>&1 &
          npx playwright test tests/web/my_tasks.spec.mjs --browser=chromium --reporter=line
      - name: Upload Web E2E failure evidence
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-failure
          path: test-results/
          if-no-files-found: ignore

  android-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Build current Android debug APK
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Install Maestro CLI 2.12.1
        env:
          MAESTRO_VERSION: '2.12.1'
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Allow KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Maestro E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            "$HOME/.maestro/bin/maestro" test maestro/flows/my_tasks_android.yaml
